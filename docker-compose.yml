services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: microservice-book
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.2
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:19093
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:19093
    ports:
      - "19093:19093"
      - "9644:9644"

  consul:
    image: consul:1.15.4
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0"
