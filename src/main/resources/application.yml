server:
  port: 8080

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: microservice-book
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rdb-microservice-book}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  docker:
    compose:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  cloud:
    aws:
      secretsmanager:
        enabled: false
    function:
      autodetect: false
    stream:
      function:
        autodetect: false
        definition: ""
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:19092}
        bindings:
          bookEvents-in-0:
            consumer:
              enableDlq: true
              dlqName: book.dlq
      bindings:
        bookEvents-out-0:
          destination: book
          content-type: application/json
        bookEvents-in-0:
          destination: book
          group: ${spring.application.name}-group
          content-type: application/json
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-max-interval: 10000
            back-off-multiplier: 2.0

naver:
  api:
    client-id: ${NAVER_CLIENT_ID:placeholder}
    client-secret: ${NAVER_CLIENT_SECRET:placeholder}
