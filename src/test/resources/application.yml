naver:
  api:
    client-id: test-id
    client-secret: test-secret

spring:
  application:
    name: microservice-book-test
  config:
    import: "" # Consul import 제거
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  cloud:
    consul:
      enabled: false
      discovery:
        enabled: false
      config:
        enabled: false
